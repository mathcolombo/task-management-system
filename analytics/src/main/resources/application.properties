spring.application.name=analytics
server.port=8083

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin

spring.datasource.url=jdbc:h2:file:./data/analyticsdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

rabbitmq.exchange.name=task.exchange
rabbitmq.queue.analytics=analytics.queue
rabbitmq.routing.created=task.created
